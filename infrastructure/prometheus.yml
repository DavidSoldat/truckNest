global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files: []

scrape_configs:
  - job_name: trucknest-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
        labels:
          app: trucknest
          env: local
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          app: prometheus
          env: local
